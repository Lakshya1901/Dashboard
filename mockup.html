<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Now / Next widget mockup (layout reference)</title>
<style>
  :root {
    --page: #f5f5f3; --card: #ffffff; --track: #eeeeec;
    --border: rgba(0,0,0,0.12); --text: #1a1a1a; --text-2: #5f5e5a; --muted: #888780;
    --accent: #378add; --accent-bg: #e6f1fb; --accent-text: #0c447c; --success: #3b6d11;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #1a1a19; --card: #262624; --track: #333331;
      --border: rgba(255,255,255,0.14); --text: #f1efe8; --text-2: #b4b2a9; --muted: #888780;
      --accent: #378add; --accent-bg: #0c447c; --accent-text: #b5d4f4; --success: #97c459;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  .wrap { max-width: 380px; margin: 0 auto; padding: 20px 16px; }
  .label { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
  .widget { background: var(--card); border: 0.5px solid var(--border); border-radius: 20px; padding: 14px 16px; }
  .row { display: flex; justify-content: space-between; align-items: center; }
  .tag { font-size: 12px; background: var(--accent-bg); color: var(--accent-text); padding: 2px 8px; border-radius: 6px; }
  .small { font-size: 12px; color: var(--text-2); margin: 0; }
  .title { font-size: 18px; font-weight: 500; margin: 0 0 6px; }
  .bar { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
  .bar > div { width: 55%; height: 100%; background: var(--accent); }
  .gantt { display: flex; gap: 4px; height: 18px; margin-bottom: 10px; }
  .gantt div { border-radius: 3px; }
  .cur { background: var(--accent); }
  .later { background: var(--accent-bg); }
  .free { background: var(--track); border: 0.5px solid var(--border); }
  .next { border-top: 0.5px solid var(--border); padding-top: 8px; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
  .sq { padding: 12px; aspect-ratio: 1; }
  .habit { font-size: 13px; margin: 0 0 3px; }
  .done { color: var(--success); }
  .pending { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <p class="label">Medium widget</p>
  <div class="widget">
    <div class="row" style="margin-bottom:10px;">
      <span class="tag">Evening · work</span>
      <span class="small">19:40</span>
    </div>
    <p class="small">Now running</p>
    <p class="title">Write project report</p>
    <div class="bar"><div></div></div>
    <div class="row small" style="margin:4px 0 12px;"><span>19:00 – 20:30</span><span>50 min left</span></div>
    <div class="gantt">
      <div class="cur" style="flex:3"></div>
      <div class="later" style="flex:1"></div>
      <div class="later" style="flex:2"></div>
      <div class="free" style="flex:1"></div>
    </div>
    <div class="next"><span style="color:var(--text-2)">Next</span> · Email and admin <span style="color:var(--muted)">20:30</span></div>
  </div>

  <div class="grid">
    <div>
      <p class="label">Small widget</p>
      <div class="widget sq">
        <p class="small" style="font-size:11px">Now</p>
        <p style="font-size:15px; font-weight:500; margin:0 0 4px; line-height:1.3;">Write project report</p>
        <p style="font-size:22px; font-weight:500; margin:0; color:var(--accent);">50m</p>
        <p class="small" style="font-size:11px; margin-top:4px;">Next: Email</p>
      </div>
    </div>
    <div>
      <p class="label">Morning routine</p>
      <div class="widget sq">
        <p class="small" style="font-size:11px; margin-bottom:6px;">Routine · 3 of 5</p>
        <p class="habit done">&#10003; Workout</p>
        <p class="habit done">&#10003; Journal</p>
        <p class="habit done">&#10003; Breakfast</p>
        <p class="habit" style="font-weight:500">&#9654; Reading</p>
        <p class="habit pending">&#9675; Study</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
